[project]
name = "portfolio-api"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style (Query(...), Depends(...) as defaults) is idiomatic.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette 1.x nudges TestClient users towards the separate `httpx2` package; we stay on httpx
# (BRIEF.md section 6), which still works.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
